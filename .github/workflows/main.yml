name: Build NexaVision AI APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q NexaVisionAI_Android_Project_v0.5_GitHubBuild.zip -d android-project

          echo "===== ZIP CONTENTS ====="
          find android-project -maxdepth 6 -type f | sort

          echo "===== GRADLE FILES ====="
          find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradlew" \) -print

          echo "===== DIRECTORY STRUCTURE ====="
          find android-project -maxdepth 4 -type d | sort

          echo "Diagnostic complete."








          
